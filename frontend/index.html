<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acortador de enlaces</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>Acortador de enlaces</h1>
    <p class="subtitle">Pega una URL y obtén un enlace corto.</p>

    <form id="shorten-form">
      <input type="text" id="url-input" placeholder="https://www.example.com/articulo" required>
      <button type="submit" id="submit-btn">Acortar</button>
    </form>

    <p id="error" class="error" hidden></p>

    <div id="result" class="result" hidden>
      <input type="text" id="short-url" readonly>
      <button type="button" id="copy-btn">Copiar</button>
    </div>
    <p id="copy-msg" class="ok" hidden>Enlace copiado</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
